<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вкус у дома</title>
<style>
:root{--bg:#f8f5ed;--card:#fffdf8;--green:#456b52;--ink:#263229;--muted:#758078;--line:#e4e0d6;--shadow:0 12px 35px #30372d14}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;background:#f8f5edf2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.logo{font:700 25px Georgia,serif;color:var(--green);margin-right:auto;white-space:nowrap}
.nav button{border:0;background:transparent;padding:9px 11px;border-radius:10px;white-space:nowrap;flex:none}
.nav button:hover{background:#eee9dd}
.primary{background:var(--green)!important;color:#fff!important;border-radius:12px!important;padding:11px 16px!important}
.ghost{border:1px solid var(--line)!important;background:#fff!important;border-radius:12px!important;padding:10px 14px}
.container{max-width:1180px;margin:auto;padding:30px 22px 70px}
.hero{padding:50px 0 30px;max-width:820px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.hero h1{font:700 clamp(42px,6vw,72px)/.98 Georgia,serif;margin:12px 0 20px}.hero p{font-size:18px;color:var(--muted);max-width:650px}
.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);padding:8px;border-radius:16px;box-shadow:var(--shadow);max-width:720px}.search input{flex:1;border:0;outline:0;padding:10px;background:transparent}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 16px}.section-title h2{font:700 30px Georgia,serif;margin:0}
.categories{display:flex;gap:10px;overflow:auto;padding-bottom:5px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:999px}.cat.active,.cat:hover{background:var(--green);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.photo{height:190px;background:linear-gradient(135deg,#dfe8dc,#eee2cf);display:grid;place-items:center;font-size:60px}.cardbody{padding:18px}.tag{font-size:12px;color:var(--green);font-weight:800}.card h3{font:700 25px Georgia,serif;margin:7px 0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.actions button{flex:1;border:1px solid var(--line);background:#fff;padding:9px;border-radius:10px}.actions .add{background:var(--green);color:#fff;border-color:var(--green)}
.dashboard{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.day{min-height:145px;background:#faf8f2;border:1px solid var(--line);border-radius:14px;padding:10px}.day strong{font-size:13px}.dayitem{background:#fff;border-radius:9px;padding:7px;margin-top:8px;font-size:12px;cursor:pointer}.mealgroup{font-size:10px;color:var(--muted);margin-top:9px;font-weight:700;letter-spacing:.04em}.shopping li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}.shopping li.done{text-decoration:line-through;color:#9aa29c}.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f4ec;border-radius:14px;padding:15px}.stat b{font-size:25px;display:block}
.modal{position:fixed;inset:0;background:#141e1873;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fffdf8;width:min(780px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:25px}.close{float:right;border:0;background:#eee9dd;border-radius:50%;width:34px;height:34px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:150px;resize:vertical}.ingredients{display:grid;gap:8px}.ingrow{display:grid;grid-template-columns:90px 95px 1fr 35px;gap:7px}.ingrow button{border:0;background:#f0ece2;border-radius:8px}.recipe-detail h1{font:700 42px Georgia,serif;margin:10px 0}.recipe-img{height:260px;border-radius:18px;background:linear-gradient(135deg,#dfe8dc,#eee2cf);display:grid;place-items:center;font-size:90px;margin-bottom:20px}.ingredient-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ingredient-list div{background:#f7f4ec;padding:10px;border-radius:9px}.step{display:flex;gap:12px;margin:12px 0}.stepno{background:var(--green);color:#fff;border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center;font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:13px 17px;border-radius:12px;z-index:50}
.authwrap{max-width:420px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}
.authtabs{display:flex;gap:8px;margin-bottom:18px}.authtabs button{flex:1;border:1px solid var(--line);background:#fff;padding:10px;border-radius:10px}.authtabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;font-size:13px;margin:0 6px 6px 0}
.friendrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.badge{font-size:11px;background:#eef1ec;color:var(--green);padding:3px 8px;border-radius:999px;font-weight:700;margin-left:6px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.dashboard{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.nav button{padding:8px 9px;font-size:13px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.ingredient-list{grid-template-columns:1fr}.week{grid-template-columns:1fr 1fr}.hero{padding-top:30px}}
</style>
</head>
<body>
<header><nav class="nav" id="navbar"></nav></header>
<main class="container" id="app"></main>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<div id="printArea" class="hidden"></div>
<script>
const DAYS=["Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота","Неделя"];
const MEALS=["Закуска","Обяд","Вечеря","Друго"];
const DEFAULT_CATS=["Закуска","Салата","Основно","Гарнитура","Десерт","Снакс","Друго"];
const UNITS=["г","кг","мл","л","бр","ч.л.","с.л.","ч.ч","кафена чаша","щипка","шепа","пакет","стрък","скилидка"];

let db=JSON.parse(localStorage.getItem("vud_db")||"null")||{users:{}};
let session=localStorage.getItem("vud_session")||null;
let currentView="home";
let activeCat="Всички";
let authMode="login";

function saveDB(){localStorage.setItem("vud_db",JSON.stringify(db))}
function me(){return session?db.users[session]:null}
function fmt(n){return Number.isInteger(n)?n:n.toFixed(2).replace(/\.00$/,"")}
function escJs(s){return String(s).replace(/'/g,"\\'")}
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2200)}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function unitsLinkHtml(){return `<a href="https://www.supichka.com/%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D0%B0/453/%D0%BC%D0%B5%D1%80%D0%BD%D0%B8-%D0%B5%D0%B4%D0%B8%D0%BD%D0%B8%D1%86%D0%B8-%D0%B2-%D0%BA%D1%83%D1%85%D0%BD%D1%8F%D1%82%D0%B0-%D0%BA%D1%83%D1%85%D0%BD%D0%B5%D0%BD%D1%81%D0%BA%D0%B8-%D0%BC%D0%B5%D1%80%D0%BA%D0%B8" target="_blank" rel="noopener" style="font-size:12px;color:var(--green);text-decoration:none;margin-left:10px;font-weight:400">📏 Мерни единици</a>`}

function seedRecipes(){
return [
{id:1,name:"Мусака - 4 порции",cat:"Основно",emoji:"🍲",time:"70 мин",servings:4,cal:"185 kcal / 100 г",public:false,fav:false,ings:[["500","г","картофи"],["500","г","кайма"],["2","бр","яйца"],["400","г","кисело мляко"]],steps:"Обели и нарежи картофите.\nЗапържи каймата.\nПодреди картофите и каймата в тава.\nРазбий яйцата с киселото мляко и залей.\nПечи до златисто."},
{id:2,name:"Баница",cat:"Закуска",emoji:"🥐",time:"50 мин",servings:6,cal:"310 kcal / порция",public:false,fav:false,ings:[["500","г","кори за баница"],["4","бр","яйца"],["400","г","кисело мляко"],["200","г","сирене"]],steps:"Разбий яйцата и киселото мляко.\nНатроши сиренето.\nРедувай кори, плънка и сирене.\nЗавърши с кори и печи до златисто."},
{id:3,name:"Шопска салата",cat:"Салата",emoji:"🥗",time:"15 мин",servings:2,cal:"120 kcal / 100 г",public:false,fav:false,ings:[["2","бр","домати"],["1","бр","краставица"],["1","бр","чушка"],["150","г","сирене"]],steps:"Нарежи зеленчуците.\nСмеси ги в купа.\nДобави сиренето и овкуси."},
{id:4,name:"Тирамису",cat:"Десерт",emoji:"🍰",time:"30 мин",servings:6,cal:"280 kcal / порция",public:false,fav:false,ings:[["250","г","маскарпоне"],["3","бр","яйца"],["200","г","бишкоти"],["200","мл","кафе"]],steps:"Приготви крема.\nПотопи бишкотите в кафето.\nРедувай бишкоти и крем.\nОхлади преди сервиране."}
];
}

/* ---------- AUTH ---------- */
function switchAuth(m){authMode=m;renderAuth()}
function doRegister(ev){
ev.preventDefault();
const u=document.getElementById("reg_user").value.trim();
const email=document.getElementById("reg_email").value.trim();
const p1=document.getElementById("reg_pass").value;
const p2=document.getElementById("reg_pass2").value;
if(!u||!email||!p1){toast("Попълни всички полета");return}
if(Object.keys(db.users).some(x=>x.toLowerCase()===u.toLowerCase())){toast("Това потребителско име вече е заето");return}
if(p1.length<4){toast("Паролата трябва да е поне 4 символа");return}
if(p1!==p2){toast("Паролите не съвпадат");return}
db.users[u]={password:p1,email,categories:[...DEFAULT_CATS],friends:[],recipes:seedRecipes(),week:{},shopping:{}};
saveDB();session=u;localStorage.setItem("vud_session",u);currentView="home";render();
}
function doLogin(ev){
ev.preventDefault();
const u=document.getElementById("log_user").value.trim();
const p=document.getElementById("log_pass").value;
const acc=Object.keys(db.users).find(x=>x.toLowerCase()===u.toLowerCase());
if(!acc||db.users[acc].password!==p){toast("Грешно потребителско име или парола");return}
session=acc;localStorage.setItem("vud_session",acc);currentView="home";render();
}
function doForgot(ev){
ev.preventDefault();
const u=document.getElementById("fg_user").value.trim();
const email=document.getElementById("fg_email").value.trim();
const p1=document.getElementById("fg_pass").value;
const acc=Object.keys(db.users).find(x=>x.toLowerCase()===u.toLowerCase());
if(!acc||db.users[acc].email.toLowerCase()!==email.toLowerCase()){toast("Няма акаунт с тези потребителско име и имейл");return}
if(p1.length<4){toast("Паролата трябва да е поне 4 символа");return}
db.users[acc].password=p1;saveDB();toast("Паролата е сменена — влез с новата парола");authMode="login";renderAuth();
}
function logout(){session=null;localStorage.removeItem("vud_session");currentView="home";render()}

function renderAuth(){
const app=document.getElementById("app");
if(authMode==="login"){
app.innerHTML=`<div class="authwrap">
<div class="authtabs"><button class="active" onclick="switchAuth('login')">Вход</button><button onclick="switchAuth('register')">Регистрация</button></div>
<h2 style="margin-top:0">Влез в профила си</h2>
<form onsubmit="doLogin(event)">
<div class="field"><label>Потребителско име</label><input id="log_user" required></div>
<div class="field" style="margin-top:10px"><label>Парола</label><input id="log_pass" type="password" required></div>
<button class="primary" style="margin-top:16px;width:100%">Вход</button>
</form>
<p style="margin-top:12px"><a href="#" onclick="switchAuth('forgot');return false" style="color:var(--green)">Забравена парола?</a></p>
</div>`;
}else if(authMode==="register"){
app.innerHTML=`<div class="authwrap">
<div class="authtabs"><button onclick="switchAuth('login')">Вход</button><button class="active" onclick="switchAuth('register')">Регистрация</button></div>
<h2 style="margin-top:0">Създай профил</h2>
<form onsubmit="doRegister(event)">
<div class="field"><label>Потребителско име</label><input id="reg_user" required></div>
<div class="field" style="margin-top:10px"><label>Имейл</label><input id="reg_email" type="email" required></div>
<div class="field" style="margin-top:10px"><label>Парола</label><input id="reg_pass" type="password" required></div>
<div class="field" style="margin-top:10px"><label>Потвърди парола</label><input id="reg_pass2" type="password" required></div>
<button class="primary" style="margin-top:16px;width:100%">Регистрирай се</button>
</form>
</div>`;
}else{
app.innerHTML=`<div class="authwrap">
<h2 style="margin-top:0">Забравена парола</h2>
<p class="muted">Демо без имейл сървър — въведи имейла, с който си регистриран, и си задай нова парола направо.</p>
<form onsubmit="doForgot(event)">
<div class="field"><label>Потребителско име</label><input id="fg_user" required></div>
<div class="field" style="margin-top:10px"><label>Имейл</label><input id="fg_email" type="email" required></div>
<div class="field" style="margin-top:10px"><label>Нова парола</label><input id="fg_pass" type="password" required></div>
<button class="primary" style="margin-top:16px;width:100%">Смени паролата</button>
</form>
<p style="margin-top:12px"><a href="#" onclick="switchAuth('login');return false" style="color:var(--green)">Обратно към вход</a></p>
</div>`;
}
}

/* ---------- NAV / ROUTING ---------- */
function renderNav(){
const nav=document.getElementById("navbar");
if(!session){nav.innerHTML=`<div class="logo">Вкус у дома</div>`;return}
nav.innerHTML=`<div class="logo">Вкус у дома</div>
<button onclick="showHome()">Начало</button>
<button onclick="showPublic()">Рецепти</button>
<button onclick="showFriends()">Приятели</button>
<button onclick="showDashboard()">Моят профил</button>
<button class="primary" onclick="openRecipeForm()">+ Добави рецепта</button>
<button class="ghost" onclick="logout()" title="Изход">⏻ ${escHtml(session)}</button>`;
}
function showHome(){currentView="home";activeCat="Всички";render()}
function showPublic(){currentView="public";activeCat="Всички";render()}
function showDashboard(){currentView="dashboard";render()}
function showFriends(){currentView="friends";render()}
function render(){
renderNav();
const app=document.getElementById("app");
if(!session){renderAuth();return}
if(currentView==="dashboard"){renderDashboard(app);return}
if(currentView==="friends"){renderFriends(app);return}
if(currentView==="public"){renderPublicFeed(app);return}
renderHome(app);
}

/* ---------- HOME (my recipes) ---------- */
function catChips(){return ["Всички",...me().categories].map(c=>`<button class="cat ${activeCat===c?"active":""}" onclick="activeCat='${escJs(c)}';render()">${escHtml(c)}</button>`).join("")+`<button class="cat" onclick="openAddCategoryModal()">+ Категория</button>`}
function openAddCategoryModal(){
const modal=document.getElementById("modal");
modal.classList.remove("hidden");
modal.innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button>
<h2>Нова категория</h2>
<div class="field"><label>Име на категория</label><input id="quickCatName" placeholder="напр. Скара"></div>
<button class="primary" style="margin-top:16px" onclick="confirmQuickCategory()">Добави</button>
</div>`;
}
function confirmQuickCategory(){
const v=document.getElementById("quickCatName").value.trim();
if(!v){toast("Въведи име на категория");return}
if(me().categories.includes(v)){toast("Тази категория вече съществува");closeModal();return}
me().categories.push(v);saveDB();closeModal();toast("Категорията е добавена");render();
}
function filtered(){
const q=(document.getElementById("search")?.value||"").toLowerCase();
return me().recipes.filter(r=>(activeCat==="Всички"||r.cat===activeCat)&&(q===""||r.name.toLowerCase().includes(q)||r.cat.toLowerCase().includes(q)));
}
function card(r){
return `<article class="card"><div class="photo">${r.emoji||"🍽️"}</div><div class="cardbody"><span class="tag">${escHtml(r.cat)}${r.public?" · Публична":" · Лична"}</span><h3>${escHtml(r.name)}</h3><div class="muted">${r.time?escHtml(r.time)+" · ":""}${r.servings?r.servings+" порции":""}${r.cal?" · "+escHtml(r.cal):""}</div><div class="actions"><button onclick="openRecipe(${r.id})">Виж рецепта</button><button class="add" onclick="addToWeek(${r.id})">+ В меню</button></div></div></article>`;
}
function renderHome(app){
app.innerHTML=`<section class="hero"><div class="eyebrow">Домашно меню · рецепти · пазаруване</div><h1>Какво ще готвим днес?</h1><p>Събирай любимите си рецепти, планирай седмицата и превръщай избраното меню в един удобен списък за пазаруване.</p>
<div class="search"><input id="search" placeholder="🔎 Търси рецепта..." oninput="renderCards()"><button class="primary">Търси</button></div></section>
<div class="section-title"><h2>Категории</h2></div><div class="categories">${catChips()}</div>
<div class="section-title"><h2>Моите рецепти</h2><button class="ghost" onclick="openRecipeForm()">+ Нова рецепта</button></div>
<div id="cards" class="grid">${filtered().map(card).join("")||"<p class='muted'>Няма намерени рецепти.</p>"}</div>`;
}
function renderCards(){const e=document.getElementById("cards");if(e)e.innerHTML=filtered().map(card).join("")||"<p class='muted'>Няма намерени рецепти.</p>"}

/* ---------- PUBLIC FEED (everyone's shared recipes) ---------- */
function publicCategories(){const set=new Set();Object.keys(db.users).forEach(u=>db.users[u].recipes.forEach(r=>{if(r.public)set.add(r.cat)}));return[...set]}
function publicItems(){
const q=(document.getElementById("search")?.value||"").toLowerCase();
let items=[];
Object.keys(db.users).forEach(u=>db.users[u].recipes.forEach(r=>{if(r.public)items.push({owner:u,r})}));
if(activeCat!=="Всички")items=items.filter(x=>x.r.cat===activeCat);
if(q)items=items.filter(x=>x.r.name.toLowerCase().includes(q));
return items;
}
function publicCard(owner,r){
const mine=owner===session;
return `<article class="card"><div class="photo">${r.emoji||"🍽️"}</div><div class="cardbody"><span class="tag">${escHtml(r.cat)}</span><span class="badge">${mine?"твоя":"от @"+escHtml(owner)}</span><h3>${escHtml(r.name)}</h3><div class="muted">${r.time?escHtml(r.time)+" · ":""}${r.servings?r.servings+" порции":""}${r.cal?" · "+escHtml(r.cal):""}</div><div class="actions">${mine?`<button onclick="openRecipe(${r.id})">Виж рецепта</button><button class="add" onclick="addToWeek(${r.id})">+ В меню</button>`:`<button onclick="openForeignRecipe('${escJs(owner)}',${r.id})">Виж рецепта</button>`}</div></div></article>`;
}
function renderPublicFeed(app){
app.innerHTML=`<section class="hero"><div class="eyebrow">Общност</div><h1>Споделени рецепти</h1><p>Разгледай публичните рецепти на всички потребители и ги добави към своите.</p>
<div class="search"><input id="search" placeholder="🔎 Търси рецепта..." oninput="renderPublicCards()"><button class="primary">Търси</button></div></section>
<div class="section-title"><h2>Категории</h2></div><div class="categories">${["Всички",...publicCategories()].map(c=>`<button class="cat ${activeCat===c?"active":""}" onclick="activeCat='${escJs(c)}';render()">${escHtml(c)}</button>`).join("")}</div>
<div class="section-title"><h2>Всички споделени рецепти</h2></div>
<div id="cards" class="grid">${publicItems().map(x=>publicCard(x.owner,x.r)).join("")||"<p class='muted'>Все още няма споделени рецепти.</p>"}</div>`;
}
function renderPublicCards(){const e=document.getElementById("cards");if(e)e.innerHTML=publicItems().map(x=>publicCard(x.owner,x.r)).join("")||"<p class='muted'>Все още няма споделени рецепти.</p>"}

function openForeignRecipe(owner,id){
const r=db.users[owner].recipes.find(x=>x.id==id);
if(!r)return;
const steps=r.steps.split(/\n+/).filter(Boolean);
const modal=document.getElementById("modal");
modal.classList.remove("hidden");
modal.innerHTML=`<div class="modalbox recipe-detail"><button class="close" onclick="closeModal()">×</button>
<div class="recipe-img">${r.emoji||"🍽️"}</div><span class="tag">${escHtml(r.cat)} · от @${escHtml(owner)}</span><h1>${escHtml(r.name)}</h1>
<p class="muted">${r.time?escHtml(r.time)+" · ":""}${r.servings?r.servings+" порции · ":""}${escHtml(r.cal||"")}</p>
<div class="actions"><button class="add" onclick="addFriendRecipe('${escJs(owner)}',${r.id})">+ Добави към моите рецепти</button></div>
<h2>Необходими продукти${unitsLinkHtml()}</h2><div class="ingredient-list">${r.ings.map(x=>`<div><b>${escHtml(x[0])} ${escHtml(x[1])}</b> ${escHtml(x[2])}</div>`).join("")}</div>
<h2>Начин на приготвяне</h2>${steps.map((s,i)=>`<div class="step"><span class="stepno">${i+1}</span><div>${escHtml(s)}</div></div>`).join("")}
</div>`;
}
function addFriendRecipe(owner,id){
const r=db.users[owner].recipes.find(x=>x.id==id);
if(!r)return;
const modal=document.getElementById("modal");
modal.classList.remove("hidden");
modal.innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button>
<h2>Добави „${escHtml(r.name)}“ към твоите рецепти</h2>
<div class="field"><label>Категория при теб</label><select id="fcat">${me().categories.map(c=>`<option>${escHtml(c)}</option>`).join("")}</select></div>
<div class="field" style="margin-top:10px"><label>Или нова категория (по желание)</label><input id="fnewcat" placeholder="напр. От приятели"></div>
<button class="primary" style="margin-top:16px" onclick="confirmAddFriendRecipe('${escJs(owner)}',${r.id})">Добави</button>
</div>`;
}
function confirmAddFriendRecipe(owner,id){
const r=db.users[owner].recipes.find(x=>x.id==id);
if(!r)return;
const newcat=document.getElementById("fnewcat").value.trim();
const cat=newcat||document.getElementById("fcat").value;
if(newcat&&!me().categories.includes(newcat))me().categories.push(newcat);
const copy=JSON.parse(JSON.stringify(r));
copy.id=Date.now();copy.cat=cat;copy.public=false;copy.fav=false;copy.fromFriend=owner;
me().recipes.push(copy);
saveDB();closeModal();toast("Добавено към твоите рецепти");showHome();
}

/* ---------- FRIENDS ---------- */
function renderFriends(app){
app.innerHTML=`<section class="hero" style="padding-bottom:20px"><div class="eyebrow">Общност</div><h1>Приятели</h1><p>Търси потребители по потребителско име и разгледай публичните им рецепти.</p>
<div class="search"><input id="friendSearch" placeholder="🔎 Потребителско име..." oninput="renderFriendResults()"><button class="primary">Търси</button></div></section>
<div class="section-title"><h2>Резултати</h2></div><div id="friendResults">${friendResultsHtml()}</div>
<div class="section-title"><h2>Твоите приятели</h2></div><div id="friendList">${friendListHtml()}</div>`;
}
function friendResultsHtml(){
const q=(document.getElementById("friendSearch")?.value||"").trim().toLowerCase();
if(!q)return "<p class='muted'>Въведи потребителско име за търсене.</p>";
const results=Object.keys(db.users).filter(u=>u!==session&&u.toLowerCase().includes(q));
if(!results.length)return "<p class='muted'>Няма намерени потребители.</p>";
return results.map(u=>{
const isFriend=me().friends.includes(u);
return `<div class="friendrow"><span>@${escHtml(u)}</span>${isFriend?`<button class="ghost" onclick="viewFriend('${escJs(u)}')">Виж рецептите</button>`:`<button class="primary" onclick="addFriend('${escJs(u)}')">+ Добави приятел</button>`}</div>`;
}).join("");
}
function friendListHtml(){
if(!me().friends.length)return "<p class='muted'>Все още нямаш добавени приятели.</p>";
return me().friends.map(u=>`<div class="friendrow"><span>@${escHtml(u)}</span><button class="ghost" onclick="viewFriend('${escJs(u)}')">Виж рецептите</button></div>`).join("");
}
function renderFriendResults(){const e=document.getElementById("friendResults");if(e)e.innerHTML=friendResultsHtml()}
function addFriend(u){if(!me().friends.includes(u))me().friends.push(u);saveDB();toast("Добавен приятел @"+u);renderFriends(document.getElementById("app"))}
function viewFriend(u){
const list=db.users[u].recipes.filter(r=>r.public);
const modal=document.getElementById("modal");
modal.classList.remove("hidden");
modal.innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button>
<h2>Публични рецепти на @${escHtml(u)}</h2>
<div class="grid" style="margin-top:14px">${list.map(r=>publicCard(u,r)).join("")||"<p class='muted'>Няма публични рецепти все още.</p>"}</div>
</div>`;
}

/* ---------- WEEKLY MENU / SHOPPING / CATEGORIES ---------- */
function addToWeek(id){pickDay(null,id)}
function pickDay(day,id){
const r=id?me().recipes.find(x=>x.id==id):null;
const modal=document.getElementById("modal");
modal.classList.remove("hidden");
modal.innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button>
<h2>Добави ${r?"„"+escHtml(r.name)+"“":"рецепта"} към ден</h2>
<div class="field"><label>Ден</label><select id="pickDay">${DAYS.map(d=>`<option ${day===d?"selected":""}>${d}</option>`).join("")}</select></div>
<div class="field" style="margin-top:10px"><label>Кога</label><select id="pickMeal">${MEALS.map(m=>`<option>${m}</option>`).join("")}</select></div>
${!r?`<div class="field" style="margin-top:10px"><label>Рецепта</label><select id="pickRecipe">${me().recipes.map(x=>`<option value="${x.id}">${escHtml(x.name)}</option>`).join("")}</select></div>`:""}
<button class="primary" style="margin-top:16px" onclick="confirmDay(${id||0})">Добави</button>
</div>`;
}
function confirmDay(id){
const d=document.getElementById("pickDay").value;
const meal=document.getElementById("pickMeal").value;
const rid=id||Number(document.getElementById("pickRecipe").value);
const wk=me().week;
wk[d]=wk[d]||[];
if(!wk[d].some(x=>x.id===rid&&x.meal===meal))wk[d].push({id:rid,meal});
saveDB();closeModal();toast("Добавено в "+d);
if(currentView==="dashboard")renderDashboard(document.getElementById("app"));
}
function removeFromDay(day,id,meal){
const wk=me().week;if(!wk[day])return;
wk[day]=wk[day].filter(x=>!(x.id==id&&x.meal===meal));
saveDB();toast("Рецептата е махната от "+day);renderDashboard(document.getElementById("app"));
}
function toggleShop(key){me().shopping[key]=!me().shopping[key];saveDB();renderDashboard(document.getElementById("app"))}
function addCategory(){
const v=document.getElementById("newCatName").value.trim();
if(!v)return;
if(me().categories.includes(v)){toast("Тази категория вече съществува");return}
me().categories.push(v);saveDB();toast("Категорията е добавена");renderDashboard(document.getElementById("app"));
}
function removeCategory(c){
if(me().recipes.some(r=>r.cat===c)){toast("Има рецепти в тази категория — премести ги първо");return}
me().categories=me().categories.filter(x=>x!==c);saveDB();renderDashboard(document.getElementById("app"));
}
function categoryChipsManage(){
return me().categories.map(c=>`<span class="chip">${escHtml(c)}${DEFAULT_CATS.includes(c)?"":` <button onclick="removeCategory('${escJs(c)}')" style="border:0;background:transparent;color:#8d493e;cursor:pointer">×</button>`}</span>`).join("");
}
function renderDashboard(app){
const wk=me().week;
const weekHtml=DAYS.map(d=>{
const entries=wk[d]||[];
const groups=MEALS.map(m=>{
const items=entries.filter(e=>e.meal===m);
if(!items.length)return "";
return `<div class="mealgroup">${m}</div>`+items.map(e=>{
const r=me().recipes.find(x=>x.id==e.id);
if(!r)return "";
return `<div class="dayitem" style="position:relative;padding-right:28px" onclick="openRecipe(${r.id})">${r.emoji} ${escHtml(r.name)}<button title="Махни" onclick="event.stopPropagation();removeFromDay('${d}',${r.id},'${m}')" style="position:absolute;right:4px;top:4px;border:0;background:#eee9dd;border-radius:6px;width:21px;height:21px;padding:0">×</button></div>`;
}).join("");
}).join("");
return `<div class="day"><strong>${d}</strong>${groups}<button style="border:0;background:transparent;color:var(--green);font-size:12px;margin-top:8px" onclick="pickDay('${d}')">+ добави</button></div>`;
}).join("");

const all={};
DAYS.forEach(d=>(wk[d]||[]).forEach(e=>{
const r=me().recipes.find(x=>x.id==e.id);
if(r)r.ings.forEach(([n,u,p])=>{const key=p.trim().toLowerCase()+"|"+u;all[key]=all[key]||{p,u,n:0};all[key].n+=Number(n)||0});
}));
const list=Object.values(all).map(x=>{const k=x.p+"|"+x.u;return `<li class="${me().shopping[k]?"done":""}" onclick="toggleShop('${escJs(k)}')"><span>${escHtml(x.p)}</span><b>${fmt(x.n)} ${escHtml(x.u)}</b></li>`}).join("")||"<p class='muted'>Добави рецепти към седмичното меню.</p>";

app.innerHTML=`<section class="hero" style="padding-bottom:20px"><div class="eyebrow">Личен профил</div><h1>Моето меню за тази седмица</h1><p>Подреди рецептите по дни и хранения и виж автоматично какво трябва да купиш.</p></section>
<div class="dashboard"><div class="panel"><div class="section-title" style="margin-top:0"><h2>Седмично меню</h2><button class="primary" onclick="openRecipeForm()">+ Рецепта</button></div><div class="week">${weekHtml}</div></div>
<div class="panel shopping"><div class="section-title" style="margin-top:0"><h2>🛒 Пазаруване</h2></div><p class="muted">Еднаквите продукти с една и съща мерна единица се обединяват.</p><ul>${list}</ul><button class="ghost" onclick="window.print()">🖨️ Принтирай</button></div></div>
<div class="panel" style="margin-top:22px"><div class="section-title" style="margin-top:0"><h2>Категории</h2></div><div class="categories" id="catManage">${categoryChipsManage()}</div>
<div style="display:flex;gap:8px;margin-top:12px"><input id="newCatName" placeholder="Нова категория" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:10px"><button class="primary" onclick="addCategory()">Добави</button></div></div>
<div class="panel" style="margin-top:22px"><div class="section-title" style="margin-top:0"><h2>Бърз преглед</h2></div><div class="profile-stats"><div class="stat"><span class="muted">Рецепти</span><b>${me().recipes.length}</b></div><div class="stat"><span class="muted">В менюто</span><b>${Object.values(wk).flat().length}</b></div><div class="stat"><span class="muted">Любими</span><b>${me().recipes.filter(r=>r.fav).length}</b></div></div></div>`;
}

/* ---------- RECIPE DETAIL / EDIT / DELETE ---------- */
function openRecipe(id){
const r=me().recipes.find(x=>x.id==id);
if(!r)return;
const steps=r.steps.split(/\n+/).filter(Boolean);
const modal=document.getElementById("modal");
modal.classList.remove("hidden");
modal.innerHTML=`<div class="modalbox recipe-detail"><button class="close" onclick="closeModal()">×</button>
<div class="recipe-img">${r.emoji||"🍽️"}</div><span class="tag">${escHtml(r.cat)}${r.public?" · Публична":" · Лична"}${r.fromFriend?" · от @"+escHtml(r.fromFriend):""}</span><h1>${escHtml(r.name)}</h1>
<p class="muted">${r.time?escHtml(r.time)+" · ":""}${r.servings?r.servings+" порции · ":""}${escHtml(r.cal||"")}</p>
<div class="actions">
<button onclick="toggleFav(${r.id})">${r.fav?"♥ Премахни от любими":"♡ Добави в любими"}</button>
<button class="add" onclick="addToWeek(${r.id})">+ В меню</button>
<button onclick="editRecipe(${r.id})">✏️ Редактирай</button>
<button onclick="shareRecipe(${r.id})">🔗 ${r.public?"Направи лична":"Направи публична"}</button>
<button onclick="deleteRecipe(${r.id})" style="border-color:#d8b8b0;color:#8d493e">🗑️ Изтрий</button>
</div>
<h2>Необходими продукти${unitsLinkHtml()}</h2><div class="ingredient-list">${r.ings.map(x=>`<div><b>${escHtml(x[0])} ${escHtml(x[1])}</b> ${escHtml(x[2])}</div>`).join("")}</div>
<h2>Начин на приготвяне</h2>${steps.map((s,i)=>`<div class="step"><span class="stepno">${i+1}</span><div>${escHtml(s)}</div></div>`).join("")}
</div>`;
}
function toggleFav(id){const r=me().recipes.find(x=>x.id==id);r.fav=!r.fav;saveDB();openRecipe(id)}
function shareRecipe(id){const r=me().recipes.find(x=>x.id==id);r.public=!r.public;saveDB();toast(r.public?"Рецептата вече е публична":"Рецептата вече е лична");openRecipe(id)}
function deleteRecipe(id){
const r=me().recipes.find(x=>x.id==id);
if(!r)return;
if(!confirm("Сигурни ли сте, че искате да изтриете „"+r.name+"“?"))return;
me().recipes=me().recipes.filter(x=>x.id!=id);
Object.keys(me().week).forEach(d=>me().week[d]=(me().week[d]||[]).filter(x=>x.id!=id));
saveDB();closeModal();toast("Рецептата е изтрита");currentView="home";render();
}

/* ---------- RECIPE FORM (create + edit) ---------- */
function ingredientNames(){const set=new Set();me().recipes.forEach(r=>r.ings.forEach(i=>{if(i[2])set.add(i[2])}));return[...set]}
function openRecipeForm(editId){
const r=editId?me().recipes.find(x=>x.id==editId):null;
const modal=document.getElementById("modal");
modal.classList.remove("hidden");
modal.innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button>
<h2>${r?"Редактирай рецепта":"Нова рецепта"}</h2>
<datalist id="ingNames">${ingredientNames().map(n=>`<option value="${escHtml(n)}">`).join("")}</datalist>
<form onsubmit="${r?`saveEditRecipe(event,${r.id})`:"createRecipe(event)"}">
<div class="formgrid">
<div class="field full"><label>Име *</label><input id="rn" required value="${r?escHtml(r.name):""}" placeholder="Напр. Мусака - 4 порции"></div>
<div class="field"><label>Категория *</label><select id="rc">${me().categories.map(c=>`<option ${r&&r.cat===c?"selected":""}>${escHtml(c)}</option>`).join("")}</select></div>
<div class="field"><label>Нова категория (по желание)</label><input id="rnewcat" placeholder="напр. Meal prep"></div>
<div class="field"><label>Време (по желание)</label><input id="rt" value="${r?escHtml(r.time||""):""}" placeholder="45 мин"></div>
<div class="field"><label>Порции (по желание)</label><input id="rs" type="number" min="1" value="${r&&r.servings?r.servings:""}"></div>
<div class="field full"><label>Калории (по желание)</label><div style="display:flex;gap:10px"><input id="rk" type="number" min="0" placeholder="250" value="${r&&r.cal?escHtml(r.cal.split(" ")[0]):""}"><select id="rkunit"><option>за 100 г</option><option>за порция</option></select></div></div>
<div class="field full"><label>Продукти *</label><div class="ingredients" id="ings"></div><div style="display:flex;gap:8px;margin-top:4px"><button type="button" class="ghost" onclick="addIng()">+ Добави продукт</button><a class="ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="https://www.supichka.com/%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D0%B0/453/%D0%BC%D0%B5%D1%80%D0%BD%D0%B8-%D0%B5%D0%B4%D0%B8%D0%BD%D0%B8%D1%86%D0%B8-%D0%B2-%D0%BA%D1%83%D1%85%D0%BD%D1%8F%D1%82%D0%B0-%D0%BA%D1%83%D1%85%D0%BD%D0%B5%D0%BD%D1%81%D0%BA%D0%B8-%D0%BC%D0%B5%D1%80%D0%BA%D0%B8" target="_blank" rel="noopener">📏 Мерни единици</a></div></div>
<div class="field full"><label>Начин на приготвяне</label><textarea id="rsteps" placeholder="Напиши стъпките свободно...">${r?escHtml(r.steps):""}</textarea></div>
</div>
<div style="margin-top:18px"><button class="primary">${r?"Запази промените":"Запази рецептата"}</button></div>
</form></div>`;
if(r){r.ings.forEach(i=>addIng(i))}else{addIng();addIng();addIng()}
}
function addIng(prefill){
const e=document.createElement("div");
e.className="ingrow";
const amt=prefill?escHtml(prefill[0]):"";
const unit=prefill?prefill[1]:"г";
const name=prefill?escHtml(prefill[2]):"";
e.innerHTML=`<input placeholder="Кол." value="${amt}"><select>${UNITS.map(u=>`<option ${u===unit?"selected":""}>${u}</option>`).join("")}</select><input placeholder="Продукт" value="${name}" list="ingNames"><button type="button" onclick="this.parentElement.remove()">×</button>`;
document.getElementById("ings").appendChild(e);
}
function readIngRows(){return[...document.querySelectorAll(".ingrow")].map(row=>{const a=row.querySelectorAll("input");return[a[0].value.trim(),row.querySelector("select").value,a[1].value.trim()]}).filter(x=>x[2])}
function createRecipe(ev){
ev.preventDefault();
const newcat=document.getElementById("rnewcat").value.trim();
const cat=newcat||document.getElementById("rc").value;
if(newcat&&!me().categories.includes(cat))me().categories.push(cat);
const ings=readIngRows();
if(!ings.length){toast("Добави поне един продукт");return}
const k=document.getElementById("rk").value.trim();
me().recipes.push({id:Date.now(),name:document.getElementById("rn").value.trim(),cat,emoji:"🍽️",time:document.getElementById("rt").value.trim(),servings:document.getElementById("rs").value,cal:k?(k+" kcal / "+document.getElementById("rkunit").value.replace("за ","")):"",public:false,fav:false,ings,steps:document.getElementById("rsteps").value.trim()});
saveDB();closeModal();toast("Рецептата е запазена");showHome();
}
function editRecipe(id){closeModal();openRecipeForm(id)}
function saveEditRecipe(ev,id){
ev.preventDefault();
const r=me().recipes.find(x=>x.id==id);
if(!r)return;
const newcat=document.getElementById("rnewcat").value.trim();
const cat=newcat||document.getElementById("rc").value;
if(newcat&&!me().categories.includes(cat))me().categories.push(cat);
const ings=readIngRows();
if(!ings.length){toast("Добави поне един продукт");return}
const k=document.getElementById("rk").value.trim();
r.name=document.getElementById("rn").value.trim();
r.cat=cat;
r.time=document.getElementById("rt").value.trim();
r.servings=document.getElementById("rs").value;
r.cal=k?(k+" kcal / "+document.getElementById("rkunit").value.replace("за ","")):"";
r.ings=ings;
r.steps=document.getElementById("rsteps").value.trim();
saveDB();closeModal();toast("Промените са запазени");openRecipe(id);
}

render();
</script>
</body></html>
