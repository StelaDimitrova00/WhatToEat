<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вкус у дома</title>
<style>
:root{--bg:#f8f5ed;--card:#fffdf8;--green:#456b52;--ink:#263229;--muted:#758078;--line:#e4e0d6;--shadow:0 12px 35px #30372d14}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;background:#f8f5edf2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.logo{font:700 25px Georgia,serif;color:var(--green);margin-right:auto;white-space:nowrap}
.nav button{border:0;background:transparent;padding:9px 11px;border-radius:10px;white-space:nowrap;flex:none}
.nav button:hover{background:#eee9dd}
.primary{background:var(--green)!important;color:#fff!important;border-radius:12px!important;padding:11px 16px!important}
.ghost{border:1px solid var(--line)!important;background:#fff!important;border-radius:12px!important;padding:10px 14px}
.container{max-width:1180px;margin:auto;padding:30px 22px 70px}
.hero{padding:50px 0 30px;max-width:820px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.hero h1{font:700 clamp(42px,6vw,72px)/.98 Georgia,serif;margin:12px 0 20px}.hero p{font-size:18px;color:var(--muted);max-width:650px}
.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);padding:8px;border-radius:16px;box-shadow:var(--shadow);max-width:720px}.search input{flex:1;border:0;outline:0;padding:10px;background:transparent}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 16px}.section-title h2{font:700 30px Georgia,serif;margin:0}
.categories{display:flex;gap:10px;overflow:auto;padding-bottom:5px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:999px}.cat.active,.cat:hover{background:var(--green);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.photo{height:190px;background:linear-gradient(135deg,#dfe8dc,#eee2cf);display:grid;place-items:center;font-size:60px}.cardbody{padding:18px}.tag{font-size:12px;color:var(--green);font-weight:800}.card h3{font:700 25px Georgia,serif;margin:7px 0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.actions button{flex:1;border:1px solid var(--line);background:#fff;padding:9px;border-radius:10px}.actions .add{background:var(--green);color:#fff;border-color:var(--green)}
.dashboard{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.day{min-height:145px;background:#faf8f2;border:1px solid var(--line);border-radius:14px;padding:10px}.day strong{font-size:13px}.dayitem{background:#fff;border-radius:9px;padding:7px;margin-top:8px;font-size:12px;cursor:pointer}.mealgroup{font-size:10px;color:var(--muted);margin-top:9px;font-weight:700;letter-spacing:.04em}.shopping li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}.shopping li.done{text-decoration:line-through;color:#9aa29c}.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f4ec;border-radius:14px;padding:15px}.stat b{font-size:25px;display:block}
.modal{position:fixed;inset:0;background:#141e1873;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fffdf8;width:min(780px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:25px}.close{float:right;border:0;background:#eee9dd;border-radius:50%;width:34px;height:34px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:150px;resize:vertical}.ingredients{display:grid;gap:8px}.ingrow{display:grid;grid-template-columns:90px 95px 1fr 35px;gap:7px}.ingrow button{border:0;background:#f0ece2;border-radius:8px}.recipe-detail h1{font:700 42px Georgia,serif;margin:10px 0}.recipe-img{height:260px;border-radius:18px;background:linear-gradient(135deg,#dfe8dc,#eee2cf);display:grid;place-items:center;font-size:90px;margin-bottom:20px}.ingredient-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ingredient-list div{background:#f7f4ec;padding:10px;border-radius:9px}.step{display:flex;gap:12px;margin:12px 0}.stepno{background:var(--green);color:#fff;border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center;font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:13px 17px;border-radius:12px;z-index:50}
.authwrap{max-width:420px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}
.authtabs{display:flex;gap:8px;margin-bottom:18px}.authtabs button{flex:1;border:1px solid var(--line);background:#fff;padding:10px;border-radius:10px}.authtabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;font-size:13px;margin:0 6px 6px 0}
.friendrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.badge{font-size:11px;background:#eef1ec;color:var(--green);padding:3px 8px;border-radius:999px;font-weight:700;margin-left:6px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.dashboard{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.nav button{padding:8px 9px;font-size:13px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.ingredient-list{grid-template-columns:1fr}.week{grid-template-columns:1fr 1fr}.hero{padding-top:30px}}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<header><nav class="nav" id="navbar"></nav></header>
<main class="container" id="app"></main>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<div id="printArea" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/views.js"></script>
<script src="js/recipes.js"></script>
<script src="js/app.js"></script>
</body></html>
