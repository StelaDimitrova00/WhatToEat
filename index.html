<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF9F5">
<title>Рецепти за всеки ден</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ТОКЕНИ
   ============================================================ */
:root{
  --bg:#FBF9F5;
  --surface:#FFFFFF;
  --surface-2:#F4F1EA;
  --surface-3:#ECE7DC;
  --ink:#1B241E;
  --ink-2:#47534B;
  --muted:#7C877F;
  --line:#E7E2D7;
  --line-2:#D9D3C5;
  --brand:#2F6A4E;
  --brand-2:#245540;
  --brand-soft:#E9F1EC;
  --accent:#BE6E3C;
  --accent-soft:#FAF0E8;
  --danger:#B14539;
  --danger-soft:#FBECEA;
  --gold:#C2932F;

  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --sh-xs:0 1px 2px rgba(27,36,30,.05);
  --sh-sm:0 1px 3px rgba(27,36,30,.07),0 1px 2px rgba(27,36,30,.04);
  --sh:0 4px 14px rgba(27,36,30,.06),0 14px 34px rgba(27,36,30,.05);
  --sh-lg:0 16px 56px rgba(27,36,30,.16);
  --ring:0 0 0 3px rgba(47,106,78,.22);

  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --header-h:74px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* ============================================================
   ОСНОВИ
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}
.hidden{display:none!important}
:focus-visible{outline:0;box-shadow:var(--ring);border-radius:8px}
::selection{background:var(--brand-soft)}

h1,h2,h3{margin:0;font-family:var(--serif);font-weight:700;letter-spacing:-.015em;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{
  color:var(--brand);font-weight:700;font-size:11.5px;
  letter-spacing:.13em;text-transform:uppercase;
}

/* ============================================================
   ХЕДЪР + НАВИГАЦИЯ
   ============================================================ */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(251,249,245,.82);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.nav{
  max-width:1200px;margin:auto;height:var(--header-h);
  padding:0 22px;display:flex;align-items:center;gap:8px;
}
.logo{
  display:flex;align-items:center;flex:none;margin-right:22px;
  border-radius:12px;padding:2px;
  transition:opacity .16s var(--ease),transform .16s var(--ease);
}
.logo:hover{opacity:.85}
.logo:active{transform:scale(.97)}
.logo img{height:58px;width:auto;display:block}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-search{position:relative;flex:0 1 270px;margin-left:auto;min-width:120px}
.nav-search input{
  width:100%;padding:9px 13px 9px 36px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface);
  font-size:14px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.nav-search input::placeholder{color:var(--muted)}
.nav-search input:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.nav-search .si{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:13px;pointer-events:none;
}
.navlink{
  padding:9px 14px;border-radius:10px;font-weight:500;color:var(--ink-2);
  transition:background .16s var(--ease),color .16s var(--ease);white-space:nowrap;
}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-right{display:flex;align-items:center;gap:8px}
.user-chip{
  display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface);
  font-size:13.5px;font-weight:500;color:var(--ink-2);
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.user-chip:hover{border-color:var(--line-2);box-shadow:var(--sh-xs)}
.avatar{
  width:28px;height:28px;border-radius:50%;flex:none;
  background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.02em;
}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:var(--muted);font-size:15px;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* долна лента за телефон */
.tabbar{display:none}

/* ============================================================
   БУТОНИ
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 17px;border-radius:12px;font-size:14.5px;font-weight:600;
  border:1px solid transparent;white-space:nowrap;
  transition:background .16s var(--ease),border-color .16s var(--ease),
             box-shadow .16s var(--ease),transform .12s var(--ease),color .16s var(--ease);
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

.primary{background:var(--brand);color:#fff;box-shadow:var(--sh-sm)}
.primary:hover:not(:disabled){background:var(--brand-2);box-shadow:var(--sh)}

.ghost{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.ghost:hover:not(:disabled){border-color:var(--line-2);background:var(--surface);color:var(--ink)}

.soft{background:var(--surface-2);color:var(--ink-2)}
.soft:hover:not(:disabled){background:var(--surface-3);color:var(--ink)}

.danger{background:var(--surface);border-color:#E8CFCB;color:var(--danger)}
.danger:hover:not(:disabled){background:var(--danger-soft)}

.btn-sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn-block{width:100%}

/* ============================================================
   ЛЕЙАУТ
   ============================================================ */
.container{max-width:1200px;margin:auto;padding:34px 22px 90px}
.hero{padding:16px 0 26px;max-width:760px}
.hero h1{font-size:clamp(32px,4.6vw,50px);margin:12px 0 12px}
.hero p{font-size:16.5px;color:var(--ink-2);max-width:620px}

.section-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;margin:34px 0 16px;
}
.section-head h2{font-size:24px}
.sub{font-family:var(--sans);font-size:13.5px;font-weight:400;color:var(--muted);margin-top:4px}

/* ============================================================
   СТРАНИЧНА ЛЕНТА С КАТЕГОРИИ
   ============================================================ */
.browse{display:grid;grid-template-columns:212px minmax(0,1fr);gap:30px;align-items:start}
.browse>*{min-width:0}   /* иначе съдържанието разпъва колоната и страницата излиза встрани */
.sidebar{position:sticky;top:calc(var(--header-h) + 22px)}
.seg{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:12px;margin-bottom:20px}
.seg button{
  flex:1;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:600;
  color:var(--muted);white-space:nowrap;
  transition:background .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease);
}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--sh-xs)}
.side-title{
  font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);padding:0 12px;margin-bottom:10px;
}
.catlist{flex-direction:column;overflow:visible;gap:2px;padding:0}
.catlist .cat{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  text-align:left;border-color:transparent;background:transparent;
  border-radius:10px;padding:9px 12px;font-weight:500;
}
.catlist .cat:hover{background:var(--surface-2);border-color:transparent;color:var(--ink)}
.catlist .cat.active{
  background:var(--brand-soft);color:var(--brand);border-color:transparent;font-weight:600;
}
.catlist .cnt{
  font-size:11.5px;font-weight:600;color:var(--muted);
  background:var(--surface-2);border-radius:999px;padding:1px 7px;min-width:22px;text-align:center;
}
.catlist .cat.active .cnt{background:rgba(47,106,78,.13);color:var(--brand)}
.catlist .cat.add{
  border:1px dashed var(--line-2);color:var(--muted);margin-top:8px;justify-content:center;
}
.catlist .cat.add:hover{color:var(--brand);border-color:var(--brand)}

/* ============================================================
   ТЪРСАЧКА
   ============================================================ */
.search{position:relative;max-width:520px}
.search input{
  width:100%;padding:13px 16px 13px 44px;
  border:1px solid var(--line);border-radius:14px;background:var(--surface);
  box-shadow:var(--sh-xs);transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.search .si{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:15px;pointer-events:none;
}

/* ============================================================
   ЧИПОВЕ / КАТЕГОРИИ
   ============================================================ */
.categories{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;
  scrollbar-width:thin;-webkit-overflow-scrolling:touch;
}
#catManage{flex-wrap:wrap;overflow:visible}
.categories::-webkit-scrollbar{height:5px}
.categories::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
.cat{
  white-space:nowrap;flex:none;padding:8px 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);
  font-size:13.5px;font-weight:500;color:var(--ink-2);
  transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease);
}
.cat:hover{border-color:var(--brand);color:var(--brand)}
.cat.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.cat.add{border-style:dashed;color:var(--muted)}
.cat.add:hover{color:var(--brand)}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);
  padding:7px 10px 7px 8px;border-radius:999px;font-size:13.5px;font-weight:500;
  box-shadow:var(--sh-xs);
}
.chip .grip{
  cursor:grab;color:var(--line-2);user-select:none;touch-action:none;
  letter-spacing:-2px;padding:0 3px 0 1px;font-size:13px;
}
.chip .grip:active{cursor:grabbing}
.chip button{
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  color:var(--muted);font-size:12px;transition:background .14s,color .14s;
}
.chip button:hover{background:var(--surface-2);color:var(--ink)}
.chip button.del:hover{background:var(--danger-soft);color:var(--danger)}
.chip.dragging{opacity:.4;border-style:dashed;box-shadow:none}

/* ============================================================
   КАРТИ С РЕЦЕПТИ
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--sh-sm);display:flex;flex-direction:column;
  transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease);
}
.card:hover{box-shadow:var(--sh);transform:translateY(-3px);border-color:var(--line-2)}
.photo{
  position:relative;height:180px;flex:none;
  background:linear-gradient(140deg,#E4EDE3,#F3E7D6);
  display:grid;place-items:center;font-size:54px;
}
.photo img,.recipe-img img{width:100%;height:100%;object-fit:cover;display:block}
.cardbody{padding:17px 18px 18px;display:flex;flex-direction:column;flex:1}
.card-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:20px;margin:8px 0 6px}
.tag{
  font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--brand);
}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.actions .btn{flex:1}
.badge{
  font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink-2);
  padding:3px 9px;border-radius:999px;
}
.fav-dot{
  position:absolute;top:11px;right:11px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.93);display:grid;place-items:center;
  font-size:14px;color:var(--danger);box-shadow:var(--sh-sm);
}

/* ============================================================
   ПАНЕЛИ / ПРОФИЛ
   ============================================================ */
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px;align-items:start}
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-sm);
  min-width:0;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel-head h2{font-size:19px}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{
  min-height:150px;background:var(--surface-2);border:1px solid transparent;
  border-radius:var(--r);padding:11px 10px;display:flex;flex-direction:column;
}
.day.today{background:var(--brand-soft);border-color:#CFE3D8}
.day-name{
  font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:4px;
}
.day.today .day-name{color:var(--brand)}
.day-today-dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
.mealgroup{
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-top:11px;
}
.dayitem{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:7px 24px 7px 8px;margin-top:6px;
  font-size:12.5px;line-height:1.35;cursor:pointer;
  transition:border-color .14s,box-shadow .14s;
}
.dayitem:hover{border-color:var(--line-2);box-shadow:var(--sh-xs)}
.dayitem button{
  position:absolute;right:4px;top:4px;width:19px;height:19px;border-radius:6px;
  color:var(--muted);font-size:11px;display:grid;place-items:center;
}
.dayitem button:hover{background:var(--danger-soft);color:var(--danger)}
.day-add{
  margin-top:auto;padding-top:9px;color:var(--brand);font-size:12px;font-weight:600;
  text-align:left;opacity:.75;transition:opacity .14s;
}
.day-add:hover{opacity:1}

/* списък за пазаруване */
.shopping ul{list-style:none;margin:0;padding:0}
.shopping li{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;
  padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;
}
.shopping li:last-child{border-bottom:0}
.shopping li::before{
  content:"";width:19px;height:19px;border:1.8px solid var(--line-2);border-radius:6px;
  flex:none;transition:background .14s var(--ease),border-color .14s var(--ease);
}
.shopping li:hover::before{border-color:var(--brand)}
.shopping li.done{color:var(--muted)}
.shopping li.done span,.shopping li.done b{text-decoration:line-through}
.shopping li.done::before{
  background:var(--brand);border-color:var(--brand);
  content:"✓";color:#fff;font-size:12px;display:grid;place-items:center;line-height:1;
}
.shopping li>span{min-width:0;overflow-wrap:anywhere}
.shopping li b{font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.shopping li>span:last-child{display:flex;align-items:center;gap:8px}
.shopping li>span:last-child button{
  width:21px;height:21px;border-radius:6px;color:var(--muted);font-size:12px;
  display:grid;place-items:center;
}
.shopping li>span:last-child button:hover{background:var(--danger-soft);color:var(--danger)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;max-width:600px}
.stat{background:var(--surface-2);border-radius:var(--r);padding:15px 14px}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-family:var(--serif);font-size:27px;display:block;margin-top:3px;line-height:1}

/* ============================================================
   ФОРМИ
   ============================================================ */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formgrid>*{min-width:0}   /* grid елементите иначе не се свиват под съдържанието си */
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea,.field select{
  width:100%;min-width:0;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;
  background:var(--surface);transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.field input:focus,.field textarea:focus,.field select:focus{
  outline:0;border-color:var(--brand);box-shadow:var(--ring);
}
.field textarea{min-height:150px;resize:vertical;line-height:1.65}
.hint{font-size:12.5px;color:var(--muted)}
.add-row{display:flex;gap:9px;margin-top:16px;max-width:420px}
.add-row input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px 13px;background:var(--surface);
}
.add-row input:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.add-row .btn{flex:none}

.ingredients{display:grid;gap:8px}
.ingrow{display:grid;grid-template-columns:88px 104px 1fr 36px;gap:8px}
.ingrow input,.ingrow select{
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;background:var(--surface);
  min-width:0;   /* без това редът не се свива и изтласква страницата встрани */
}
.ingrow input:focus,.ingrow select:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.ingrow button{
  border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted);
  display:grid;place-items:center;transition:background .14s,color .14s;
}
.ingrow button:hover{background:var(--danger-soft);color:var(--danger)}

.photo-picker{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photo-picker .photo{
  width:136px;height:102px;border-radius:var(--r);font-size:36px;flex:none;
  overflow:hidden;border:1px solid var(--line);
}
.file-input{
  font-size:13px;color:var(--ink-2);max-width:240px;
}
.file-input::file-selector-button{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:8px 13px;border-radius:10px;margin-right:10px;cursor:pointer;
  font:inherit;font-size:13.5px;font-weight:600;
}
.file-input::file-selector-button:hover{border-color:var(--line-2)}

/* ============================================================
   МОДАЛИ
   ============================================================ */
.modal{
  position:fixed;inset:0;z-index:40;background:rgba(20,30,24,.5);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fade .18s var(--ease);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modalbox{
  background:var(--surface);width:min(760px,100%);max-height:92vh;
  border-radius:var(--r-xl);box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;overflow:hidden;
  animation:pop .22s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:20px 24px;border-bottom:1px solid var(--line);flex:none;
}
.modal-head h2{font-size:21px}
.modal-body{padding:24px;overflow:auto;flex:1}
.modal-foot{
  padding:16px 24px;border-top:1px solid var(--line);flex:none;
  display:flex;justify-content:flex-end;gap:10px;background:var(--surface);
}
.close{
  width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);
  display:grid;place-items:center;font-size:17px;flex:none;transition:background .14s;
}
.close:hover{background:var(--surface-3)}

/* детайл на рецепта */
.recipe-img{
  height:280px;border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(140deg,#E4EDE3,#F3E7D6);
  display:grid;place-items:center;font-size:84px;margin-bottom:22px;
}
.recipe-detail h1{font-size:clamp(27px,4vw,38px);margin:10px 0 8px}
.recipe-detail h2{font-size:18px;margin:28px 0 13px;display:flex;align-items:center;gap:8px}
.ingredient-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ingredient-list div{
  background:var(--surface-2);padding:11px 13px;border-radius:var(--r-sm);font-size:14px;
}
.ingredient-list b{font-weight:600;color:var(--brand)}
.step{display:flex;gap:13px;margin:13px 0;font-size:14.5px;line-height:1.65}
.stepno{
  background:var(--brand-soft);color:var(--brand);border-radius:50%;
  min-width:27px;height:27px;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;flex:none;margin-top:2px;
}

/* ============================================================
   ВХОД / РЕГИСТРАЦИЯ
   ============================================================ */
.authwrap{
  max-width:430px;margin:40px auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-xl);
  padding:32px;box-shadow:var(--sh);
}
.auth-logo{
  display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;text-align:center;
}
.auth-logo img{height:104px;width:auto;display:block}
.auth-logo h2{font-size:24px}
.authtabs{
  display:flex;gap:4px;margin-bottom:22px;background:var(--surface-2);
  padding:4px;border-radius:12px;
}
.authtabs button{
  flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);
  transition:background .16s var(--ease),color .16s var(--ease);
}
.authtabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--sh-xs)}
.authwrap .field+.field{margin-top:14px}

/* ============================================================
   ПРИЯТЕЛИ
   ============================================================ */
.friendrow{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.friendrow:last-child{border-bottom:0}
.friend-id{display:flex;align-items:center;gap:11px;font-weight:500}

/* ============================================================
   ПРАЗНИ СЪСТОЯНИЯ / SKELETON / TOAST
   ============================================================ */
.empty{
  text-align:center;padding:52px 24px;border:1px dashed var(--line-2);
  border-radius:var(--r-lg);background:var(--surface);
}
.empty .ei{font-size:38px;display:block;margin-bottom:12px;opacity:.6}
.empty h3{font-size:18px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:14px;max-width:340px;margin:0 auto}
.empty .btn{margin-top:17px}

.sk{background:var(--surface-3);border-radius:8px;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%,100%{opacity:.55}50%{opacity:.95}}
.sk-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
}
.sk-card .sk-img{height:180px;border-radius:0}
.sk-card .sk-body{padding:18px;display:grid;gap:9px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;
  z-index:60;font-size:14px;font-weight:500;box-shadow:var(--sh-lg);
  max-width:calc(100vw - 40px);text-align:center;
  animation:toastin .22s var(--ease);
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ============================================================
   АДАПТИВНОСТ
   ============================================================ */
@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .browse{grid-template-columns:1fr;gap:20px}
  .sidebar{position:static}
  .side-title{display:none}
  /* wrap вместо хоризонтален скрол — така и "+ Категория" се вижда винаги */
  .catlist{flex-direction:row;flex-wrap:wrap;overflow:visible;gap:8px;padding-bottom:0}
  .catlist .cat{
    width:auto;flex:none;justify-content:center;border-radius:999px;padding:8px 15px;
    border:1px solid var(--line);background:var(--surface);
  }
  .catlist .cat.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .catlist .cat.add{margin-top:0;border-style:dashed}
  .catlist .cnt{display:none}
}
@media(max-width:820px){
  .nav-links{display:none}
  .nav-right .primary{display:none}
  .nav-search{flex:1 1 auto;margin-left:12px}
  .container{padding:24px 18px 100px}
  .week{
    display:flex;overflow-x:auto;gap:10px;padding-bottom:8px;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  }
  .day{min-width:min(74%,250px);scroll-snap-align:start;flex:none}
  .ingredient-list{grid-template-columns:1fr}
  .recipe-img{height:210px}
  .modalbox{max-height:94vh}
  .modal{padding:0;align-items:flex-end}
  .modalbox{border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-height:93vh}

  /* долна навигация */
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(251,249,245,.94);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 4px;border-radius:11px;font-size:10.5px;font-weight:600;
    color:var(--muted);transition:color .16s var(--ease),background .16s var(--ease);
  }
  .tab i{font-style:normal;font-size:19px;line-height:1}
  .tab.active{color:var(--brand);background:var(--brand-soft)}
  .tab.tab-add i{
    background:var(--brand);color:#fff;width:34px;height:34px;border-radius:11px;
    display:grid;place-items:center;font-size:20px;margin-top:-2px;box-shadow:var(--sh-sm);
  }
  .tab.tab-add{color:var(--brand)}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
  /* количество + мярка отгоре, продукт отдолу — иначе полето за име е неизползваемо */
  .ingrow{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;
    grid-template-areas:"qty unit unit" "name name del";
    gap:7px;
  }
  .ingrow>input:first-child{grid-area:qty}
  .ingrow>select{grid-area:unit}
  .ingrow>input:nth-child(3){grid-area:name}
  .ingrow>button{grid-area:del}
  .field.full{grid-column:auto}
  .stats{gap:8px}
  .stat{padding:13px 11px}
  .stat b{font-size:23px}
  .hero{padding-top:6px}
  .hero h1{font-size:31px}
  .modal-body,.modal-head,.modal-foot{padding-left:18px;padding-right:18px}
  .user-chip .uname{display:none}
  .user-chip{padding:5px}
  .logo{margin-right:0}
  .logo img{height:46px}
  .nav{gap:6px;padding:0 12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
